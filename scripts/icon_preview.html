const TILES = {"Terminal":["#23272f","#0f1216"],"Browser":["#0e4c8a","#08304f"],"Explorer":["#1c5f8a","#0f3a56"],
"SysInfo":["#3a4351","#262c36"],"Clock":["#3a4351","#262c36"],"PCI":["#275a4d","#16332c"],
"Snake":["#1c6b4a","#0f3a2a"],"Calc":["#4a3a8a","#2c2452"],"Task Mgr":["#3a4351","#262c36"],
"Flappy":["#8a6a1c","#52401a"],"Notepad":["#5c6470","#3d434c"],"ELF Demo":["#6b2a52","#3f1a30"]};
const g = document.getElementById('grid');
for (const [name, rows] of Object.entries(ICONS)) {
  const h = document.createElement('h3'); h.textContent = name; g.appendChild(h);
  const row = document.createElement('div'); row.className = 'row'; g.appendChild(row);
  const [tint, dark] = TILES[name];
  const variants = [ [tint, 3, null], [dark, 3, null], [null, 1, 3] ];
  for (const [tile, scale, cellPx] of variants) {
    const cell = document.createElement('div'); cell.className = 'cell'; row.appendChild(cell);
    const wrap = tile ? `<div class="tile" style="background:${tile};width:${16*scale+22}px;height:${16*scale+22}px">` : '';
    const c = document.createElement('canvas');
    const px = cellPx ? cellPx : scale;
    c.width = 16*px; c.height = 16*px;
    c.style.width = (16*scale)+'px'; c.style.height = (16*scale)+'px';
    const ctx = c.getContext('2d');
    if (!tile) { ctx.fillStyle = "#20242b"; ctx.fillRect(0,0,c.width,c.height); }
    for (let y=0;y<16;y++) for (let x=0;x<16;x++) {
      const ch = rows[y][x];
      if (ch==='1') ctx.fillStyle = FG;
      else if (ch==='2') ctx.fillStyle = IN;
      else continue;
      ctx.fillRect(x*px,y*px,px,px);
    }
    if (wrap) { cell.innerHTML = wrap; cell.firstChild.appendChild(c); }
    else cell.appendChild(c);
  }
}
