name: Build & Boot Test

on:
  push:
    branches: [main]
  pull_request:

# The old single build-and-boot job ran the whole 30+-test suite serially in
# one QEMU-at-a-time job (~30 minutes per push). The suite is now SPLIT into
# independent jobs that GitHub runs in parallel; each job boots the same
# fresh ISO + disk images and owns an unrelated slice of the test space
# (feature areas / hardware emulations), so jobs cannot interfere through
# shared ports or persistent disk state (freshly created per job):
#   build          -> compile + artifact upload (prerequisite)
#   boot-core      -> boot/login, fuzzer, procfs, fork, job control, fs, sync, limits
#   gui            -> login/lock/paint/taskbar/startmenu/explorer/fbmap/hardening
#   browser-net    -> browser HTTP + hostname/gateway + POSIX socket + poll/select
#   doom-rust      -> windowed DOOM, Rust app, ASLR (2 boots), fsync/mmap/lseek
#   quake3         -> ioquake3 engine core on the MECTOV_Q3=1 ISO variant
#   storage        -> FAT32/mount/AHCI/xHCI/VirtIO/bigread-DMA/iocache/write-failure
#   selftest       -> watchdogs, TLB shootdown, multi-core panic (if: always())
#   kvm            -> KVM 4-core fork/FPU (skips itself when /dev/kvm is absent)
#   config-matrix  -> unchanged 12-combo boot+fork matrix on the artifacts
#   ram-sweep      -> 6-combo guest-RAM sweep on the artifacts
#   kernel64       -> the 64-bit mainline kernel: build + its own gate battery
#
# kernel64 is independent of `build` on purpose: it needs none of the 32-bit
# artifacts, and it builds its own ISO and its own disk fixtures from scratch.
# Depending on `build` would serialise the two lines behind each other for no
# gain, and the 32-bit jobs would then fail whenever a 64-bit-only change
# broke something.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-multilib \
            nasm \
            grub-pc-bin \
            xorriso \
            mtools \
            dosfstools \
            qemu-system-x86 \
            python3-pil \
            e2fsprogs

      - name: Install Rust (for apps/rusthello.rs)
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          ~/.cargo/bin/rustup target add i686-unknown-uefi

      - name: Build kernel
        run: |
          # all32 is explicit: bare `make` builds the 64-bit kernel now.
          make clean_all
          make all32
          test -f myos.bin && echo "myos.bin built OK"

      - name: Build boot ISO
        run: |
          mkdir -p iso/boot/grub
          cp myos.bin iso/boot/
          cat > iso/boot/grub/grub.cfg << 'EOF'
          set timeout=0
          set default=0
          menuentry "Mectov OS" {
              multiboot /boot/myos.bin
              boot
          }
          EOF
          grub-mkrescue -o mectov.iso iso
          test -f mectov.iso && echo "mectov.iso built OK"

      - name: Create disk images
        run: |
          # Fresh, empty images — the same way run.sh creates them locally.
          dd if=/dev/zero of=disk.img bs=512 count=4096 status=none
          dd if=/dev/zero of=ext2.img bs=1M count=16 status=none
          mkfs.ext2 -F ext2.img > /dev/null 2>&1
          # System blobs for the debloated kernel (v38.81): doom1.wad /
          # wallpaper.bin / music.wav live on /ext2, loaded on demand.
          bash scripts/seed_ext2.sh ext2.img
          dd if=/dev/zero of=fat32.img bs=1M count=16 status=none
          mkfs.fat -F 32 -S 512 fat32.img > /dev/null 2>&1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mectov-artifacts
          path: |
            mectov.iso
            myos.bin
            disk.img
            ext2.img
          if-no-files-found: error
          retention-days: 1

      - name: Build Q3 kernel variant (MECTOV_Q3=1)
        run: |
          # v38.99: second ISO with the Q3 engine core compiled in. The
          # default ISO must stay engine-free; only the quake3 job boots
          # this variant. disk/ext2 copies ship alongside so the test job
          # gets the same fresh-image state as every other job.
          #
          # `make iso` here also runs the `qvm` target (v38.105), which builds
          # qagame.qvm from id's own source with id's own lcc + q3asm. That
          # file did not exist when ext2.img was seeded above, so re-seed the
          # volume afterwards — otherwise ext2-q3.img would ship without the
          # bytecode the q3vm job boots (seed_ext2.sh skips missing sources).
          MECTOV_Q3=1 make iso
          bash scripts/seed_ext2.sh ext2.img
          mv mectov.iso mectov-q3.iso
          cp disk.img disk-q3.img
          cp ext2.img ext2-q3.img
          test -f mectov-q3.iso && echo "mectov-q3.iso built OK"
          test -f build/vm/qagame.qvm && echo "qagame.qvm built OK"

      - name: Upload Q3 build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mectov-q3-artifacts
          path: |
            mectov-q3.iso
            disk-q3.img
            ext2-q3.img
            build/vm/qagame.qvm
            build/vm/qagame.map
          if-no-files-found: error
          retention-days: 1
      # The two bytecode files are here because the q3arena / q3vis / q3retail
      # suites RECREATE ext2.img themselves (q3_images.fresh_images, v38.111+)
      # rather than trusting the shipped one — that is what makes each suite's
      # assertions independent of whatever ran before it. seed_ext2.sh SKIPS a
      # missing qagame.qvm without failing (it is a developer convenience when
      # the engine was built without MECTOV_Q3=1), so a checkout that lacks
      # build/ produced a volume with no bytecode and the guest parked at
      # "[Q3VM] FAILED: no qagame.qvm" — silently, and only in CI. The build/
      # tree is git-ignored, so shipping the files in the artifact is the only
      # way the test job gets them. qagame.map rides along because q3vm_test.py
      # asserts id's loader can name symbols out of it.

  # Shared setup for every test job: install QEMU + PIL, pull the artifacts,
  # recreate the FAT32 scratch image (fat32.img is deliberately NOT shipped —
  # every job creates its own so persistent state can never leak across jobs).
  boot-core:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qemu-system-x86 \
            python3-pil \
            dosfstools \
            mtools

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: mectov-artifacts
          path: .

      - name: Boot test in QEMU (no KVM)
        run: |
          python3 scripts/boot_test.py --timeout 240

      - name: Ring 3 syscall fuzzer regression (TCG)
        run: |
          # ~2000 random syscalls with garbage pointers/sizes/fds from Ring 3:
          # the kernel must reject every one without panicking.
          python3 scripts/fuzz_test.py --timeout 300

      - name: Procfs + symlink regression (TCG)
        run: |
          python3 scripts/procfs_test.py --timeout 240

      - name: Procfs /proc/sys tunables regression (TCG)
        run: |
          # v38.91: drives the /proc/sys tunables from the terminal — cat
          # /proc/sys/all lists every knob with its range, `echo N >
          # /proc/sys/zombie_reap_ms` changes the zombie reaper (read back),
          # out-of-range and garbage writes are rejected without corrupting
          # the knob, load_window and futex_sweep_div likewise, and the
          # procsysdemo Ring 3 app proves nice/setnice + CPU% accounting.
          python3 scripts/procsys_test.py --timeout 240

      - name: Fork + jobcontrol regressions (TCG)
        run: |
          python3 scripts/fork_test.py --timeout 240
          python3 scripts/jobcontrol_test.py --timeout 240

      - name: FPU/SSE context-switch regression (TCG)
        run: |
          python3 scripts/fputest.py --timeout 240

      - name: PAE + NX (W^X) regression (TCG)
        run: |
          python3 scripts/nxtest.py --timeout 240

      - name: FAT32 regression (drive 3, TCG)
        run: |
          python3 scripts/fat32_test.py --timeout 240

      - name: poll/select/getcwd/chdir/clock_gettime regression (TCG)
        run: |
          python3 scripts/pollselect_test.py --timeout 240

      - name: Futex mutex + condvar regression (TCG, 1 core)
        run: |
          # Ring 3 conddemo app: 4 threads bump a shared counter to exactly
          # 20,000 under a futex mutex, then 2 producers + 2 consumers move
          # 3,000 items through a bounded buffer over a condvar. Asserts ALL
          # PASS + every item consumed exactly once + zero [PANIC].
          # v38.92: pinned to 1 core. A PRE-EXISTING cross-core race in the
          # Ring 3 condvar hot path (observed on the v38.91 baseline too:
          # consumed count off by one, item lost/duped, ~1 run in 4-6 on
          # 2+ cores; SMP1 100% green across stress) is being root-caused
          # separately; pinning keeps this suite meaningful without masking
          # it as a random CI flake. The kernel futex/cond semantics (timed
          # wait, per-waiter deadline, requeue op) are still fully exercised.
          MCTOV_SMP=1 python3 scripts/cond_test.py --timeout 480

      - name: Resource limits (RLIMIT_NPROC/AS/NOFILE) regression (TCG)
        run: |
          python3 scripts/rlimit_test.py --timeout 360

      - name: Shell `ulimit` builtin regression (TCG)
        run: |
          python3 scripts/ulimit_test.py --timeout 360

  gui:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qemu-system-x86 \
            python3-pil \
            dosfstools

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: mectov-artifacts
          path: .

      - name: Redesigned login screen regression (TCG)
        run: |
          python3 scripts/login_redesign_test.py --timeout 300

      - name: Lock screen feature regression (TCG)
        run: |
          python3 scripts/lock_test.py --timeout 480

      - name: Idle auto-lock (locktimeout) regression (TCG)
        run: |
          python3 scripts/autolock_test.py --timeout 480

      - name: Kernel hardening regression (CSPRNG + salted passwd) (TCG)
        run: |
          python3 scripts/hardening_test.py --timeout 480

      - name: Ring 3 scanout takeover regression (TCG)
        run: |
          python3 scripts/fbmap_test.py --timeout 480

      - name: Taskbar window buttons + hover regression (TCG)
        run: |
          python3 scripts/taskbar_hover_test.py --timeout 300

      - name: Start menu search-as-you-type regression (TCG)
        run: |
          python3 scripts/startmenu_search_test.py --timeout 300

      - name: File Explorer GUI regression (TCG)
        run: |
          python3 scripts/explorer_test.py --timeout 300

      - name: Pixel Paint GUI regression (TCG)
        run: |
          python3 scripts/paint_test.py --timeout 300

      - name: Desktop icon renderer regression (TCG)
        run: |
          python3 scripts/icon_render_test.py --timeout 300

      - name: Antialiased font regression (TCG)
        run: |
          python3 scripts/font_render_test.py --timeout 300

      - name: Tmpfs /tmp regression (TCG)
        run: |
          python3 scripts/tmpfs_test.py --timeout 300

  browser-net:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qemu-system-x86 \
            python3-pil \
            dosfstools

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: mectov-artifacts
          path: .

      - name: Browser HTTP fetch + render regression (TCG)
        run: |
          # Picks a free host port itself; never collides with the sibling
          # net job (which pins its own free port for the gateway).
          python3 scripts/browser_test.py --timeout 300

      - name: Browser hostname path — DNS + port-80 gateway redirect (TCG)
        run: |
          # Gateway port is chosen at runtime; the kernel redirects port 80
          # to the port the test passes, so two parallel net jobs cannot
          # collide as long as each picks its own free port.
          python3 scripts/browser_web_test.py --timeout 300

      - name: POSIX socket regression (user-net + hostfwd, TCG)
        run: |
          python3 scripts/socktest.py --timeout 300

  doom-rust:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qemu-system-x86 \
            python3-pil \
            dosfstools

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: mectov-artifacts
          path: .

      - name: Windowed DOOM smoke test (TCG)
        run: |
          # v38.29: `doom` renders into a WM window like any desktop app. One
          # boot: launch the Terminal, run `doom`, assert a DOOM window opens,
          # the game loop enters, and [DOOM] tick lines prove frames are
          # produced (composited by the WM) without crashing the OS.
          python3 scripts/doom_test.py --timeout 480

      - name: Rust Ring 3 app regression (TCG)
        run: |
          python3 scripts/rusthello_test.py --timeout 240

      - name: File-backed mmap regression (TCG)
        run: |
          python3 scripts/mmapfile_test.py --timeout 240

      - name: fsync/sync + periodic write-back regression (TCG)
        run: |
          # v38.61: syncfiledemo dirties file-backed mmap pages, persists
          # them via fsync(fd), then dirties again and SLEEPS — the kernel's
          # ~5 s periodic write-back must flush on its own.
          python3 scripts/syncfile_test.py --timeout 300

      - name: lseek/fstat/O_APPEND regression (TCG)
        run: |
          python3 scripts/lseekfile_test.py --timeout 240

      - name: ASLR regression — PIE ELF base randomized across boots (TCG)
        run: |
          # v38.63: two consecutive boots each run the PIE syncdemo.elf twice;
          # the test asserts bases differ across boots AND within one boot.
          python3 scripts/aslr_test.py --timeout 300

  quake3:
    needs: build
    runs-on: ubuntu-latest
    # v38.127: raised from 35 — the HUD step is two boots (the port cannot
    # relaunch after ESC, so the `nohud` A/B is a second session).
    # v38.128: raised again for the sky step, which is two more boots of the
    # same kind (one with the cloud box on, one with `nosky`).
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qemu-system-x86 \
            python3-pil \
            dosfstools

      - name: Download Q3 build artifacts
        uses: actions/download-artifact@v4
        with:
          name: mectov-q3-artifacts
          path: .

      # The bytecode must be on disk BEFORE any suite that re-seeds a volume.
      # seed_ext2.sh treats a missing qagame.qvm as "engine not built" and
      # moves on, so this is the one place that can catch it — the suites
      # themselves just time out waiting for a marker that never arrives.
      - name: Verify the game bytecode arrived
        run: |
          set -euo pipefail
          for f in build/vm/qagame.qvm build/vm/qagame.map; do
            if [ ! -s "$f" ]; then
              echo "[!] missing or empty: $f" >&2
              echo "    seed_ext2.sh would skip it silently and every QVM" >&2
              echo "    suite would fail at its ready-marker instead." >&2
              exit 1
            fi
          done
          ls -l build/vm/qagame.qvm build/vm/qagame.map
          # Readable by q3vm_test.py's byte-size identity check, which compares
          # the staged copy against the host build.
          test "$(stat -c%s build/vm/qagame.qvm)" -gt 100000
          test "$(stat -c%s build/vm/qagame.map)" -gt 1000

      - name: Restore disk image names
        run: |
          cp disk-q3.img disk.img
          cp ext2-q3.img ext2.img

      - name: Q3 engine core regression (TCG)
        run: |
          # v38.99: boots the MECTOV_Q3=1 ISO, types `q3` in the Terminal,
          # and asserts Com_Init + 10 Com_Frame ticks complete with the OS
          # alive. The engine runs on a dedicated kernel task forked by
          # cmd_q3 (IF=1) with its config I/O on tmpfs — never inline in
          # the shell syscall, which executes with interrupts disabled.
          # The core is id Software's official source (v38.105), so the
          # Com_Init banner is id's own version string: Q3 1.32b.
          python3 scripts/q3_test.py --iso mectov-q3.iso --timeout 300

      - name: TinyGL gears window (visual, TCG)
        run: |
          # v38.102 (Q3 phase 2): the TinyGL software rasterizer renders the
          # lit gears scene into a WM window. The test types `q3gl` and
          # asserts via serial that the context + window came up and frames
          # tick, then pixel-checks a real screendump for the three gear
          # body colors (blue/red/green from the demo materials) and that
          # two later frames differ — the scene is genuinely animated on the
          # composited desktop, not a frozen framebuffer.
          python3 scripts/q3gl_test.py --iso mectov-q3.iso --timeout 420

      - name: Q3 client loop — TinyGL + WM input (TCG)
        run: |
          # v38.103 (Q3 phase 3): the client layer (CL_Init/CL_Frame) renders
          # a first-person arena through TinyGL into a WM window. The test
          # pixel-checks the screendump, then drives real input: a held `w`
          # must arrive as a raw scancode (+forward) and MOVE the camera, and
          # injected mouse motion must reach CL_MouseEvent through the WM's
          # capture and turn the view (frame pixels must differ afterwards).
          # ESC has to shut the client down and hand the desktop back.
          python3 scripts/q3play_test.py --iso mectov-q3.iso --timeout 480

      - name: Official id game bytecode in id's own VM (TCG)
        run: |
          # v38.105 (Q3 phase 5): types `q3vm` and asserts that qagame.qvm —
          # real Quake III Arena game bytecode built from third_party/q3a by
          # id's own lcc + q3asm, staged on the ext2 volume — is loaded by
          # id's own QVM loader (1050 symbols parsed from vm/qagame.map),
          # executed by id's own interpreter, and that GAME_INIT runs
          # G_InitGame to completion (worldspawn + registered items, zero
          # unhandled traps). Needs build/vm/qagame.qvm in the checkout for
          # the byte-size comparison; skipped gracefully when absent.
          python3 scripts/q3vm_test.py --iso mectov-q3.iso --timeout 480

      - name: The module's own level, drawn (TCG)
        run: |
          # v38.108 (Q3 phase 8): types `q3arena` — the same official qagame
          # session as the step above, but with the .bsp the module is standing
          # in rendered through TinyGL. Asserts the render mesh came from the
          # level's own file, that all four of its textures were decoded from
          # the game data on the ext2 volume (no placeholders), that surfaces
          # are really submitted, that every sampled frame is made of the
          # level's palette with ZERO clear-colour pixels (the check that
          # catches a view transform that points the camera at nothing), that
          # the window is on the desktop where the driver asked, that the scene
          # is live, and that id's Pmove moves the player inside the drawn
          # level. Frames are classified out of the renderer's own ZBuffer, so
          # the assertions do not depend on the compositor.
          python3 scripts/q3arena_test.py --iso mectov-q3.iso --timeout 600

      - name: The map's own PVS decides what is drawn (TCG)
        run: |
          # v38.112 (Q3 phase 10): types `q3arena mectovvis` — the same session
          # as the arena step, but against a fixture whose tree has TWO leaves
          # and a real two-cluster visibility lump (mectovvis.bsp: the camera
          # spawns in the west leaf, which sees only itself, and the scripted
          # walk crosses the split at x=100). Asserts the loader kept the file's
          # tree and lump, that its own leaf walk AGREES with id's
          # CM_PointLeafnum at every sample point, that the marked count at the
          # spawn is exactly the west half (computed from the generator, not
          # hard-coded) and rises to the whole mesh once the camera changes
          # leaf, that marked + culled-by-PVS equals the mesh's face count on
          # every sampled frame, and that a culled frame is still the live,
          # textured level rather than a black screen.
          python3 scripts/q3vis_test.py --iso mectov-q3.iso --timeout 600

      - name: The retail-map path — staged pak0, shader scripts, JPEG (TCG)
        run: |
          # v38.111 (Q3 phase 9): the whole pipeline a user's own pak0 goes
          # through, with no id data: build_q3pak.py wraps the generated arena
          # in a genuine pk3 (scripts/*.shader, TGA textures, one JPEG),
          # q3a_data.py stages it — the shader script REBINDS the curve shader
          # to a JPEG, so staging proves the definitions were actually read —
          # and the suite boots the result and runs `q3arena mectovtest`.
          # Asserts the mesh came from the staged map, the curve shader
          # resolved to the JPEG through the script (fmt=jpg), the four
          # directly-named textures resolved to their TGAs, no placeholders,
          # and the world is really drawn and live.
          python3 scripts/q3retail_test.py --iso mectov-q3.iso --timeout 600

      - name: id's own status bar, decoded off the screen (TCG)
        run: |
          # v38.127 (Q3 phase 22): the HUD, in two boots so the A/B is real
          # (the port cannot relaunch after ESC). build_q3pak.py ships a
          # synthetic picture set in id's own formats whose number fields
          # encode their digit in a colour, and q3a_data.py --with-hud stages
          # it through the REAL staging path — so CI can prove id's status bar
          # without a byte of id's art. Asserts the loader asked for all
          # fifteen of id's names and got them (15 image(s), 0 missing), that
          # the health column tracked the module's OWN countdown (id spawns at
          # STAT_MAX_HEALTH + 25 and g_active.c takes it back down 1/s, so the
          # samples read 115, 105, 100), that the ammo and health fields DECODE
          # to 100 out of the screendump at id's own x positions, that the ammo
          # icon is at id's icon offset while the armor icon is nowhere (armor
          # 0, and id wraps field and icon in `if (value > 0)`), that the FFA
          # score box carries gfx/2d/select, and that a `nohud` boot paints
          # none of it while the frame histogram — the other suites' pixel
          # evidence — stays identical.
          python3 scripts/q3hud_test.py --iso mectov-q3.iso --timeout 600

      - name: Q3 sky (v38.128)
        run: |
          # v38.128 (Q3 phase 23): the level's own sky, drawn the way id draws
          # it — the `surfaceparm sky` surfaces are clipped into the six sides
          # of a box centred on the camera, and the shader's layers fill it at
          # `skyparms`' cloud height with their `tcMod scroll`/`scale` running
          # on the game clock. The fixture is a second generated map
          # (build_test_bsp.build(sky_ceiling=True)) whose ceiling is an
          # opaque base layer plus an ADDITIVE cloud layer, both written the way
          # q3dm1's textures/skies/tim_hell is: an additive layer can only ADD
          # light, so the suite's near-white pixel count in the sky band is
          # something the base layer cannot produce at any light level. With
          # the camera PINNED, two screendumps a minute apart have to be
          # pixel-identical over the world band and different over the sky
          # band, and a second boot with `nosky` is the control where neither
          # moves and no additive layer is drawn.
          python3 scripts/q3sky_test.py --iso mectov-q3.iso --timeout 600

      # v38.142 retired the sound bridge (the game runs silent), and
      # q3snd_test.py went with it — the step that used to sit here called a
      # script that no longer exists, so it could only ever fail with
      # "can't open file". It was masked until the HUD step above it started
      # passing, which is exactly the kind of dead CI step this workflow is
      # supposed to never carry. q3hud and q3sky are the Q3 evidence now.

  storage:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qemu-system-x86 \
            python3-pil \
            dosfstools \
            mtools

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: mectov-artifacts
          path: .

      - name: Create FAT32 scratch image
        run: |
          # Per-job fresh image (same as the old shared job did before every
          # run): mount/AHCI/xHCI/VirtIO tests need an empty FAT32 volume.
          dd if=/dev/zero of=fat32.img bs=1M count=16 status=none
          mkfs.fat -F 32 -S 512 fat32.img > /dev/null 2>&1

      - name: Mount/umount roundtrip regression (TCG)
        run: |
          python3 scripts/mount_test.py --timeout 240

      - name: AHCI/SATA driver regression (ich9-ahci + drive 4, TCG)
        run: |
          # Asserts the ich9-ahci port registers, `mount /sata fat32 4`,
          # `cp` inside the volume, and byte-compares COPY.TXT with mtools.
          python3 scripts/ahci_test.py --timeout 360

      - name: xHCI/USB 3.0 driver regression (qemu-xhci + drive 8, TCG)
        run: |
          # Asserts SuperSpeed enumeration (PORTSC speed = 4), `mount /usb
          # fat32 8`, `cp` inside the volume, mtools byte-compare.
          python3 scripts/usb_test.py --timeout 360

      - name: VirtIO-Blk driver regression (virtio-blk-pci + drive 12, TCG)
        run: |
          # Legacy 1AF4:1001 virtqueue, `mount /vblk fat32 12`, `cp`, mtools
          # byte-compare, and per-volume coexistence (boot FAT32 drive 3).
          python3 scripts/virtio_test.py --timeout 360

      - name: VirtIO-GPU driver regression (modern virtio-pci, 2D round trip, TCG)
        run: |
          # This device has NO legacy interface (1AF4:1050, no I/O BAR under any
          # flag), so the suite asserts the modern bring-up itself — the four
          # vendor-capability regions, the 64-bit feature word with
          # VIRTIO_F_VERSION_1, the control queue — and then the data path:
          # a screendump OF THE DEVICE's own scanout must match the pattern the
          # driver handed it in all 16384 pixels, and `gpustat` must repeat the
          # live checksum. No GL needed (the script's --gl flag is opt-in).
          python3 scripts/virtiogpu_test.py --timeout 360

      - name: IDE DMA + multi-sector disk read regression (TCG)
        run: |
          # /bench.big (seeded by the kernel on first boot, 160 KB >
          # PCACHE_MAX_FILE) read 3x through the bus-mastering IDE DMA path;
          # asserts the DMA controller engaged, zero failed transfers, and
          # the byte pattern surviving every read.
          python3 scripts/bigread_test.py --timeout 420

      - name: Whole-file page cache regression (TCG)
        run: |
          # Cached reads must beat cold disk reads by >= 4x (iobench's own
          # verdict); exercises the write-through + save-skip path.
          python3 scripts/iocache_test.py --timeout 300

      - name: Medium write-failure propagation — control (TCG)
        run: |
          # v38.159 (audit F1): apps/wfiledemo.c writes 512 bytes to /fat32 and
          # prints what the syscalls returned; the host reads the file back with
          # mtools. The control boot must show write + read-back + medium all
          # agreeing. It seeds its own fixture (--fat32 fat32_wfail.img) so the
          # job's empty-scratch fat32.img is never touched.
          python3 scripts/wfail_test.py --mode control --timeout 240 --fat32 fat32_wfail.img

      - name: Medium write-failure propagation — blkdebug EIO injection (TCG)
        run: |
          # The same boot with the FAT32 image wrapped in QEMU's blkdebug
          # filter: every write_aio is refused with errno EIO while reads stay
          # normal. The guest must report the refusal to the writer (no "WFILE
          # write ok") and mtools must find no file on the medium. Before
          # v38.159 this boot reported success; the step fails if the false
          # success ever comes back.
          python3 scripts/wfail_test.py --mode inject --timeout 240 --fat32 fat32_wfail.img

  selftest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qemu-system-x86 \
            python3-pil \
            dosfstools \
            grub-pc-bin \
            xorriso \
            mtools

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: mectov-artifacts
          path: .

      - name: Watchdog hard-lockup self-test (TCG)
        run: |
          python3 scripts/watchdog_test.py --timeout 240

      - name: Watchdog BSP-hang self-test (per-core mesh, TCG)
        run: |
          # Boots with `wd_self_test_bsp panic=reboot` and -no-reboot: the
          # BSP cli-spins from its own main loop, so its own detector is
          # dead. An AP mesh detector must declare CPU 0 HUNG, NMI-dump all
          # cores (the BSP answers from inside its spin) and reset.
          python3 scripts/watchdog_bsp_test.py --timeout 240

      - name: TLB shootdown IPI self-test (TCG)
        run: |
          # Boots with `tlb_self_test panic=reboot` and -no-reboot: the BSP
          # parks one AP, fires two shootdowns, then resets so QEMU exits.
          python3 scripts/tlb_sd_test.py --timeout 240

      - name: Multi-core panic dump + panic=reboot self-test (TCG)
        run: |
          # Boots with `panic_self_test panic=reboot` and -no-reboot: the
          # kernel panics deliberately, must dump registers for all 4 cores
          # (NMI-IPI snapshot), then reset so QEMU exits cleanly.
          python3 scripts/panic_test.py --timeout 240

  kvm:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qemu-system-x86 \
            python3-pil \
            dosfstools

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: mectov-artifacts
          path: .

      - name: Fork KVM 4-core — mandatory SMP keyboard regression
        run: |
          # Most GitHub-hosted ubuntu-latest runners expose /dev/kvm; guard
          # anyway so a KVM-less runner skips with a warning instead of
          # burning the full boot timeout.
          if [ -e /dev/kvm ] && [ -r /dev/kvm ]; then
            python3 scripts/fork_test.py --kvm --timeout 240
            python3 scripts/fputest.py --kvm --timeout 240
          else
            echo "::warning::/dev/kvm not available on this runner — skipping the KVM regression"
          fi

  # Config matrix (v38.68): the full suite used to run on ONE configuration
  # (qemu32,+nx / 128 MB / SMP 4). Mectov's own history proves combo-only
  # bugs are real — the KVM fork-GPF and the qemu32,+nx boot stall each
  # appeared only under a specific CPU/RAM/SMP combination. This job smokes
  # boot + fork/login on every combination of CPU model x RAM x CPU count
  # (12 jobs, run in parallel by GitHub): NX-less qemu32 vs Nehalem, the RAM
  # floor vs a guest large enough for the nominal reservation (48 vs 256 MB —
  # the middle of the curve is ram-sweep's job), and 1 / 2 / 4 cores
  # (SMP bring-up, runqueue, watchdog mesh).
  #
  # The RAM axis is 48, not 64: since v38.100 the frame reservation is derived
  # from detected RAM, so the interesting failures cluster on the RAM axis.
  # 48MB is the measured floor where boot AND fork both pass; below it the
  # desktop still paints while the app-launch path runs out of room, which is
  # exactly the false-green boot_test now refuses to report (see
  # memory_sanity_errors: it asserts a non-zero heap ceiling and a real shared
  # zero page, both of which a starved guest loses).
  config-matrix:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cpu: [qemu32, Nehalem]
        mem: [48, 256]
        smp: [1, 2, 4]
    name: "config ${{ matrix.cpu }} / ${{ matrix.mem }}MB / SMP ${{ matrix.smp }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fresh ubuntu runner: QEMU is NOT installed by default and does not
      # come with the downloaded artifacts. The build job installs it for its
      # own steps; this job must do the same or every combo dies at step 1
      # with "qemu-system-i386: command not found".
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qemu-system-x86 \
            python3-pil

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: mectov-artifacts
          path: .

      - name: Boot + login + desktop smoke
        run: |
          python3 scripts/boot_test.py \
            --cpu ${{ matrix.cpu }} \
            --mem-mb ${{ matrix.mem }} \
            --smp ${{ matrix.smp }} \
            --timeout 240

      - name: Fork / waitpid / signal smoke
        run: |
          python3 scripts/fork_test.py \
            --cpu ${{ matrix.cpu }} \
            --mem-mb ${{ matrix.mem }} \
            --smp ${{ matrix.smp }} \
            --timeout 240

  # RAM sweep (v38.101). phys_init now derives the kernel reservation from the
  # detected RAM size (cap the nominal 80MB when it would leave no frames;
  # raise it back when the heap floor would not fit inside), so the whole
  # failure surface lives on the RAM axis. config-matrix only samples the two
  # regimes' anchors (48MB floor / 256MB nominal); this job walks the interior
  # and the cap boundary, on both CPU models at 4 cores:
  #
  #   64 MB  — comfortably capped, heap ~24MB
  #   96 MB  — still capped, heap ~48MB (approaching the nominal 56MB)
  #  128 MB  — the cap/nominal boundary: 80MB reserve + 25% floor is now
  #            satisfiable, so this is the first point that takes the nominal
  #            reservation (heap back to its full 56MB)
  #
  # Each point runs the same boot + fork pair as config-matrix. Values below
  # 48MB are deliberately absent: 32/40MB boot and log in but cannot launch an
  # app (the heap is too small for the desktop assets, so the wallpaper falls
  # back and the launch path starves), so they are not supported configs.
  ram-sweep:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cpu: [qemu32, Nehalem]
        mem: [64, 96, 128]
        smp: [4]
    name: "ram ${{ matrix.cpu }} / ${{ matrix.mem }}MB / SMP ${{ matrix.smp }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qemu-system-x86 \
            python3-pil

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: mectov-artifacts
          path: .

      - name: Boot + login + desktop smoke
        run: |
          python3 scripts/boot_test.py \
            --cpu ${{ matrix.cpu }} \
            --mem-mb ${{ matrix.mem }} \
            --smp ${{ matrix.smp }} \
            --timeout 240

      - name: Fork / waitpid / signal smoke
        run: |
          python3 scripts/fork_test.py \
            --cpu ${{ matrix.cpu }} \
            --mem-mb ${{ matrix.mem }} \
            --smp ${{ matrix.smp }} \
            --timeout 240

  # ---------------------------------------------------------------- 64-bit
  # The 64-bit kernel is the mainline line (bare `make` builds it). Until this
  # job existed it had no CI coverage at all: every step above builds all32 and
  # gates the 32-bit kernel, so a regression in k64/ could only be caught
  # locally. `make check64` runs run64.sh --headless (the boot-marker battery)
  # and then the six host-side gates, each of which reboots the ISO and, for
  # the hash assertions, recomputes the expected value from the same bytes on
  # the host.
  #
  # Toolchain notes, all verified rather than assumed:
  #  - python3-pil is NOT needed. gui/cons/fs tests read QEMU's P6 PPM
  #    screendumps through scripts/terminal_launch.py's own pure-Python
  #    _load_ppm; terminal_launch imports nothing but `time`.
  #  - mtools IS needed, and assuming otherwise is how this job failed from
  #    the day it landed: `grub-mkrescue` builds the ISO's EFI System
  #    Partition image with `mformat`, and without mtools `make iso64` dies
  #    at `grub-mkrescue: error: `mformat` invocation failed` (see runs
  #    36861807858 and 37189377311). dosfstools is NOT needed — FAT32
  #    belongs to the `storage` job.
  #  - e2fsprogs IS needed: scripts/mk_ext2disk.py calls mkfs.ext2 + debugfs
  #    to build the ext2 fixture the M12 gates hash.
  #  - grub-pc-bin + xorriso are needed for `make iso64` (grub-mkrescue).
  kernel64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            nasm \
            grub-pc-bin \
            xorriso \
            mtools \
            qemu-system-x86 \
            e2fsprogs

      - name: Build + gate the 64-bit kernel
        run: make check64

      - name: Serial log tail (always, for post-mortem reading)
        if: always()
        run: |
          echo "--- serial64.log ---"
          cat serial64.log 2>/dev/null | tail -120 || echo "(no serial output)"
          for f in serial_blktest.log serial_fstest.log serial_kbdtest.log \
                   serial_heaptest.log serial_gui.log serial_cons.log; do
            [ -f "$f" ] && echo "--- $f ---" && tail -40 "$f"
          done

      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel64-serial
          path: |
            serial64.log
            serial_blktest.log
            serial_fstest.log
            serial_kbdtest.log
            serial_heaptest.log
            serial_gui.log
            serial_cons.log
            .check/*.ppm
          if-no-files-found: ignore
          retention-days: 7
